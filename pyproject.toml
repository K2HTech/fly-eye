[project]
name = "fly-eye"
version = "0.1.0"
description = "A lightweight sports tracking system inspired by Hawk-Eye."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
desktop = [
    "pyside6",
]
ml = [
    "torch",
]

[dependency-groups]
dev = [
    "pip-audit",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
