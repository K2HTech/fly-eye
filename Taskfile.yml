version: "3"

tasks:
  default:
    desc: List available development tasks
    cmds:
      - task --list

  setup:
    desc: Install locked frontend dependencies and the Rust audit tool
    cmds:
      - npm ci
      - cargo install cargo-audit --locked

  dev:
    desc: Run the React application in a browser
    cmds:
      - npm run dev

  desktop:run:
    desc: Run the React application in the Tauri desktop host
    cmds:
      - npm run tauri dev

  desktop:build:
    desc: Build native Tauri bundles for the current platform
    cmds:
      - npm run desktop:build

  format:
    desc: Format web project files with Prettier
    cmds:
      - npm run format

  format:check:
    desc: Check web project formatting
    cmds:
      - npm run format:check

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  typecheck:
    desc: Check strict TypeScript types
    cmds:
      - npm run typecheck

  test:
    desc: Run the Vitest suite
    cmds:
      - npm run test

  build:
    desc: Build the production web application
    cmds:
      - npm run build

  rust:format:
    desc: Format the Tauri Rust host
    cmds:
      - cargo fmt --manifest-path src-tauri/Cargo.toml

  rust:format:check:
    desc: Check formatting of the Tauri Rust host
    cmds:
      - cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust:check:
    desc: Compile-check the Tauri Rust host
    cmds:
      - cargo check --manifest-path src-tauri/Cargo.toml --locked

  rust:clippy:
    desc: Run Rust lints with warnings treated as errors
    cmds:
      - cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

  rust:audit:
    desc: Audit locked Rust dependencies against the RustSec advisory database
    cmds:
      - cargo audit --file src-tauri/Cargo.lock

  audit:
    desc: Audit locked npm dependencies for known vulnerabilities
    cmds:
      - npm audit --audit-level=high

  check:quality:
    desc: Run formatting, linting, types, tests, and the production web build
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test
      - task: build

  check:rust:
    desc: Run all Rust formatting, lint, and compile checks
    cmds:
      - task: rust:format:check
      - task: rust:clippy
      - task: rust:check

  check:
    desc: Run every local CI check
    cmds:
      - task: check:quality
      - task: check:rust
      - task: audit
      - task: rust:audit

  release:check:
    desc: Verify a release tag matches the application version
    requires:
      vars: [TAG]
    cmds:
      - node scripts/check-release.mjs "{{.TAG}}"
